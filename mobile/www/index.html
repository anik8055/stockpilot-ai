<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockPilot AI</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #15202e;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { color: #10233f; font-size: 1.25rem; margin: 1rem 0 0.5rem; }
  p { color: #5a6a80; line-height: 1.5; margin: 0 0 1.25rem; }
  button { height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: 6px; background: #2563c9; color: #fff; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#10233f"/><rect x="14" y="36" width="9" height="14" rx="2" fill="#8fb3ee"/><rect x="27.5" y="27" width="9" height="23" rx="2" fill="#c9daf7"/><rect x="41" y="17" width="9" height="33" rx="2" fill="#fff"/></svg>
  <h1>Can't reach StockPilot</h1>
  <p>Check your internet connection. Your data is safe on the server — nothing is lost while you're offline.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
